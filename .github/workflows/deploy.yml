name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize deploys so overlapping pushes to main can't run migrations
# concurrently. Do not cancel an in-progress deploy mid-flight.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Deploy the Worker BEFORE uploading secrets. wrangler-action uploads
      # `secrets:` before running its command, and `wrangler secret bulk`
      # fails (Cloudflare error 10000) on a script that doesn't exist yet —
      # so on the first-ever deploy the Worker must be created first.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      # Now that the Worker exists, upload runtime secrets. wrangler-action
      # reads the values for the names listed under `secrets:` from this
      # step's env and uploads them via `wrangler secret bulk`; `command`
      # defaults to `deploy`, so this also redeploys with the secrets bound.
      # GitHub secrets stay the single source of truth for runtime config.
      - name: Upload runtime secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            DATABASE_URL
            FIREBASE_PROJECT_ID
            CHAODAYS_RELAY_BASE
            CHAODAYS_RELAY_SECRET
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # chaodays egress relay (bypasses CF-Worker block). Unset -> backend calls
          # chaodays directly. Base is non-secret but kept here for a uniform upload.
          CHAODAYS_RELAY_BASE: ${{ secrets.CHAODAYS_RELAY_BASE }}
          CHAODAYS_RELAY_SECRET: ${{ secrets.CHAODAYS_RELAY_SECRET }}

      - name: Smoke test
        env:
          # Repo variable: Settings -> Secrets and variables -> Actions -> Variables.
          # No dynamic fallback is computed here (the workers.dev subdomain
          # isn't one of the configured secrets/variables) — if PRODUCTION_URL
          # isn't set, the smoke test fails with an explicit message instead
          # of silently skipping.
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "PRODUCTION_URL repo variable is not set (Settings -> Secrets and variables -> Actions -> Variables); cannot run smoke test." >&2
            exit 1
          fi

          # --retry absorbs first-request cold start / edge propagation delay.
          health_status=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 -o /dev/null -w '%{http_code}' "$URL/health") || { echo "GET $URL/health failed" >&2; exit 1; }
          if [ "$health_status" != "200" ]; then
            echo "Expected GET /health to return 200, got $health_status" >&2
            exit 1
          fi

          me_status=$(curl -s --retry 5 --retry-delay 3 --max-time 15 -o /dev/null -w '%{http_code}' "$URL/api/me")
          if [ "$me_status" != "401" ]; then
            echo "Expected GET /api/me (no token) to return 401, got $me_status" >&2
            exit 1
          fi
