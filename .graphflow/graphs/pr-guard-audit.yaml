version: 1
name: pr-guard-audit
budget: 200k
defaults:
  tier: standard

# Review-only. Nothing here builds a feature: the two PRs are already open and
# the question is whether their guards can actually fail. The built-in
# templates all implement, so none of them fits.
inputs: [target]

nodes:
  suites:
    kind: script
    # Proves the branches are green before anyone believes a review of them.
    # `test/db` is deliberately excluded: PGlite times out when the eleven db
    # files run in parallel under load, on clean main too, and those 114 tests
    # were verified file-by-file instead. Saying so here rather than letting a
    # narrowed command read as full coverage.
    run: "cd /Users/tliang/workspace/claude/code/lifeos/life-os-backend && npm run typecheck && npx vitest run --project unit --project workers && cd /Users/tliang/workspace/claude/code/lifeos/life-os && flutter analyze && flutter test"

  guard-audit:
    kind: check
    role: code-reviewer
    tier: heavy
    prompt: |
      {{ inputs.target }}

      找「不會失敗的守門」——一條斷言存在、但無論程式對錯都是綠的。**只看這兩個分支的 diff。**

      這一輪已知有三條是這樣長出來的,全部同源:fixture 被補成 null、空陣列、或跟鄰居欄位同值,所以「讀錯鍵」「接錯序列」的錯誤照樣通過。找同類漏網,並逐條說明**要怎麼突變才會讓它紅**;如果想不出能讓它紅的突變,那條就是壞守門。

      特別檢查:
      - 每個 waist 的 fixture 值,是否跟同一個物件裡的其他數值不同(相同的話,讀錯鍵仍然會過)
      - 兩個 chaodays 匯入器的保留測試,seed 的 waist 是不是真值而非 null
      - 趨勢的 metric→series 接線,fixture 是不是空陣列
      - 範圍驗證(20–300 cm)兩端是否都有測試,以及邊界值本身
      - 有沒有斷言恆為真(例如比較一個永遠不會變的東西)

      對每條發現給:檔案:行、為什麼它不會紅、能讓它紅的具體突變、建議的最小修法。

  code-review:
    kind: check
    role: code-reviewer
    prompt: |
      {{ inputs.target }}

      一般正確性 review,**只看這兩個分支的 diff**,不要提風格。重點:

      - `set` 是整列 upsert,還有沒有**其他**寫入路徑會把 waist 抹掉(不只那兩個匯入器)
      - 新欄位有沒有漏接的讀寫路徑(API、序列、控制器、儲存 payload)
      - 範圍 20–300 與前端輸入的互動:前端擋不擋、擋錯的話後端回什麼
      - 不畫正常範圍這個決定,在程式裡是否真的成立(`normalRangeFor` 有沒有可能被別的路徑塞值進去)

  fix:
    kind: task
    role: fixer
    tier: light
    after: [suites, guard-audit, code-review]
    when: any-fail
    # 只補測試與註解,不改功能行為 —— 這一輪的目的是讓守門守得住。
    prompt: "依 guard-audit 與 code-review 的發現補上守門與必要修正,**不要改功能行為**;每補一條就說明能讓它紅的突變。"
    goto: [suites, guard-audit, code-review]
    max_iterations: 2

  ship:
    kind: gate
    after: [suites, guard-audit, code-review]
    when: all-pass
    show: |
      守門稽核:
      {{ nodes.guard-audit.output }}

      一般 review:
      {{ nodes.code-review.output }}
