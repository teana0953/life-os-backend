version: 1
name: fix-workflow-sleep-restart
budget: 900k
defaults:
  tier: standard

inputs: [goal]

nodes:
  plan:
    kind: task
    role: planner
    tier: heavy
    prompt: "規劃 {{ inputs.goal }},產出步驟與檔案清單"
    output_schema: plan

  approve-plan:
    kind: gate
    after: [plan]
    show: "{{ nodes.plan.output }}"
    flow: full-only

  implement:
    kind: task
    role: implementer
    after: [approve-plan]
    prompt: "依照這份已核可的實作計畫動手,逐步完成並自我驗證:{{ nodes.plan.output }}"

  typecheck:
    kind: script
    after: [implement]
    run: "npm run typecheck"

  test:
    kind: script
    after: [implement]
    run: "npx vitest run --no-file-parallelism"

  code-review:
    kind: check
    role: code-reviewer
    after: [implement]

  uiux-review:
    kind: check
    role: uiux-reviewer
    after: [implement]
    flow: full-only

  fix:
    kind: task
    role: fixer
    after: [typecheck, test, code-review, uiux-review]
    when: any-fail
    goto: [typecheck, test, code-review, uiux-review]
    max_iterations: 3

  ship:
    kind: gate
    after: [typecheck, test, code-review, uiux-review]
    when: all-pass
    show: "{{ nodes.code-review.output }}"
