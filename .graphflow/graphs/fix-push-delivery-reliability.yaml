version: 1
name: fix-push-delivery-reliability
budget: 1200k
defaults:
  tier: standard

inputs: [goal]

nodes:
  plan:
    kind: task
    role: planner
    tier: heavy
    prompt: "規劃 {{ inputs.goal }}(那是一份 goal 檔的絕對路徑,先讀它),產出步驟與檔案清單。goal 列了七個必須自己決定的取捨——計畫裡要逐項回答:選了哪一種、依據是什麼、被放棄的那幾種各自的代價。最重要的一項是 service worker 在 app 關著時要怎麼向 ack endpoint 證明身分,那個 endpoint 是唯一不受 Firebase 保護的入口,必須說明被亂打會發生什麼事。RFC 8030 的引用 goal 檔已附查證結果,可直接沿用"
    output_schema: plan

  approve-plan:
    kind: gate
    after: [plan]
    show: "{{ nodes.plan.output }}"
    flow: full-only

  implement:
    kind: task
    role: implementer
    after: [approve-plan]
    prompt: "依照這份已核可的實作計畫動手,逐步完成並自我驗證:{{ nodes.plan.output }}。守門要斷言實際送出的 HTTP 請求標頭(注入 fetchImpl),不是斷言常數值;每條守門都要突變確認能被殺死"

  typecheck:
    kind: script
    after: [implement]
    run: "npm run typecheck"

  test:
    kind: script
    after: [implement]
    run: "npx vitest run --no-file-parallelism"

  code-review:
    kind: check
    role: code-reviewer
    after: [implement]

  fix:
    kind: task
    role: fixer
    after: [typecheck, test, code-review]
    when: any-fail
    goto: [typecheck, test, code-review]
    max_iterations: 3

  ship:
    kind: gate
    after: [typecheck, test, code-review]
    when: all-pass
    show: "{{ nodes.code-review.output }}"
