version: 1
name: gemini-signature-review
budget: 250k
defaults:
  tier: standard

# Review-only: PR #90 is already open and implemented. The question is whether
# its three guards can actually fail, and whether the opaque-token plumbing has
# a path the tests never reach.
#
# The repo's other review graph (pr-guard-audit.yaml) is not reusable here: its
# prompts are hardwired to the waist/chaodays change, and its `suites` step also
# runs the *frontend* suite, which is being edited by another agent right now.
inputs: [target]

nodes:
  suites:
    kind: script
    # Backend only, on purpose — see the note above about the frontend tree.
    # `test/db` runs with the rest here; it is the unit+workers projects that
    # cover this change.
    run: "cd /Users/tliang/workspace/claude/code/lifeos/life-os-backend && npm run typecheck && npx vitest run --project unit --project workers"

  guard-audit:
    kind: check
    role: code-reviewer
    tier: heavy
    prompt: |
      {{ inputs.target }}

      找「不會失敗的守門」——一條斷言存在、但無論程式對錯都是綠的。**只看這個分支相對 main 的 diff。**

      這個 change 的作者已經自己抓到並刪掉一條:「沒有 token 就不送 `thoughtSignature`」——body 是 `JSON.stringify` 之後才被捕捉的,`undefined` 本來就會被丟掉,所以省略鍵和賦值 `undefined` 是同一串 bytes,任何實作都綠。測試檔裡留了註解說明。**假設還有同類漏網。**

      作者宣稱這三條各自被突變驗紅過,請逐條自己重跑驗證,不要採信:
      - 拿掉抓取(`part.thoughtSignature` 不再讀)→「comes off the same part as the call it belongs to」應該紅
      - 拿掉回放(`thoughtSignature:` 那行刪掉)→「goes back verbatim, on the replayed call's own part」應該紅
      - 兩個 call 都用 `parts[0]` 的 token →「comes off the same part…」應該紅

      特別檢查:
      - fixture 的兩個 token 是否真的不同、且與 text part 的 token 也不同(相同的話「配對錯」仍會過)
      - `toEqual` 對 `undefined` 欄位的寬鬆比對,有沒有讓某條斷言其實沒在驗新欄位(既有那條 "splits a mixed reply..." 的期望值沒有 `providerToken`,它現在還證明得了什麼?)
      - 模型常數改了,有沒有任何測試其實是在驗模型名(change-detector),或反過來——完全沒有任何測試會因為送錯 model 而紅,這是不是一個該補的洞
      - 只有一輪 round 的 fixture:兩輪以上(round 1 的 token 在 round 2 仍要重送)有沒有覆蓋
      - 回放路徑與**捕捉**路徑是不是各自被測,還是只有一條端到端而另一條其實沒被獨立驗

      對每條發現給:檔案:行、為什麼它不會紅、能讓它紅的具體突變(要實際跑過)、建議的最小修法。突變一律 `cp` 備份還原,**不要用 `git checkout`**。

  code-review:
    kind: check
    role: code-reviewer
    prompt: |
      {{ inputs.target }}

      一般正確性 review,**只看這個分支相對 main 的 diff**,不要提風格。重點:

      - `providerToken` 是不透明字串,從 domain port 到 adapter 有沒有任何地方會解讀、記錄、或讓它外流(特別是錯誤訊息:這個 adapter 有「錯誤絕不帶出請求內容」的既有不變量,`ModelFailure` 的訊息與 `not.toContain(KEY)` 那組測試)
      - token 只活在單次 `converse` 內這個宣稱是否成立:`converse.ts` 的 rounds 有沒有任何路徑會被持久化、回傳給客戶端、或跨請求重用
      - 模型換成 `gemini-3.6-flash` 之後,`classifyFailure` 的四個分支是否仍然對得上 Gemini 3 的實際錯誤形狀(尤其 400 INVALID_ARGUMENT:現在同一個狀態碼既可能是壞金鑰,也可能是缺 thought_signature,會不會被誤分類成 `key_rejected` 而叫使用者去換金鑰)
      - 回應解析:text part 也會帶 `thoughtSignature`,現在的迴圈把 text 累加、把 functionCall 收集,有沒有可能把 text part 誤判成 call,或漏掉只有 signature 沒有 name 的 part
      - 有沒有其他 provider 相關的欄位是 Gemini 3 新要求、而這次沒處理的

  fix:
    kind: task
    role: fixer
    tier: light
    after: [suites, guard-audit, code-review]
    when: any-fail
    prompt: |
      依 guard-audit 與 code-review 的發現修正。每補一條守門就說明**能讓它紅的具體突變**,而且要實際跑過、看到那條測試紅,不能只用推理。

      不要補「不可能失敗的守門」:如果想不出能讓它紅的突變,就不要加那條測試,改成在測試檔裡寫下為什麼這裡刻意沒有守門。

      突變一律 `cp` 備份還原,**不要用 `git checkout`**。收尾跑 `npm run typecheck` 與 `npx vitest run --project unit --project workers`,要親眼看到全綠。
    goto: [suites, guard-audit, code-review]
    max_iterations: 2

  ship:
    kind: gate
    after: [suites, guard-audit, code-review]
    when: all-pass
    show: |
      守門稽核:
      {{ nodes.guard-audit.output }}

      一般 review:
      {{ nodes.code-review.output }}
