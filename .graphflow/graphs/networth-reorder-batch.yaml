version: 1
name: networth-reorder-batch
budget: 300k
defaults:
  tier: standard

inputs: [issue]

nodes:
  reproduce:
    kind: task
    role: implementer
    tier: heavy
    prompt: |
      {{ inputs.issue }}

      要做的是一個批次排序端點,讓一次重編是一個原子寫入:
      `PUT /api/finance/networth/accounts/order`,body `{ kind, ids[] }`,
      依 ids 的順序寫 sortOrder = 0..n-1。

      先寫**會紅**的測試,每條的 fixture 都要真的踩到失效區:

      1. **原子性(PGlite,`test/db/`)**:批次中有一筆寫入失敗時,**沒有任何一筆**
         留下新的 sortOrder。`test/db/harness.ts` 的 TABLES **目前沒有
         `finance_networth_account`**,要先加上去,否則測試之間不會清乾淨。
         這個 repo 的 `drizzle-orm/neon-http` **沒有 `transaction()`**,`db.batch`
         是唯一的原子單位 —— 用 `withBatchShim` 驗(`harness.ts`,rollback 本身
         被 `harness-batch.test.ts` 釘住)。
      2. **ids 驗證(HTTP 層)**:ids 必須剛好等於該使用者該 kind 的全部科目。
         **三種都要**:少給一筆、多給一筆、混進另一個使用者或另一個 kind 的 id。
         三種都要拒絕而且**不寫入任何一筆**。只測其中一種的話,擋不住只檢查長度
         或只檢查歸屬的實作。
      3. **封存的科目也在同一個排序空間**:fixture 要含一筆 archived,而它必須
         出現在 ids 裡、也要拿到自己的 sortOrder。漏掉它的實作要紅。

      跑 `npm test` 確認每條都紅、而且紅在斷言不是編譯錯,把「紅在哪、訊息是什麼」
      寫進輸出。

  fix:
    kind: task
    role: implementer
    after: [reproduce]
    prompt: |
      讓 {{ nodes.reproduce.output }} 的測試轉綠。

      照 CLAUDE.md 的分層做:domain port → application use case → drizzle adapter
      → route。整組更新放進**同一個 `db.batch`**。

      **同時更新 OpenSpec**:`openspec/changes/` 開一個 change,改
      `finance-networth` 的「Net-worth accounts with fixed kind and custom names」
      這條 requirement(MODIFIED 是整塊替換,**現有的三條 scenario 一條都不能漏**,
      `openspec validate --strict` 會擋)。

      不要順手改前端,那是另一個 repo。

  gate:
    kind: script
    after: [fix]
    run: "npm test && npm run typecheck"

  code-review:
    kind: check
    role: code-reviewer
    after: [fix]

  refix:
    kind: task
    role: implementer
    tier: light
    after: [gate, code-review]
    when: any-fail
    goto: [gate, code-review]
    max_iterations: 3

  ship:
    kind: gate
    after: [gate, code-review]
    when: all-pass
    show: "{{ nodes.code-review.output }}"
